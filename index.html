<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>UAS Inventory</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="app"></div>
    <dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
    <dialog id="dlg2" aria-labelledby="dlg2Title"></dialog>
    <div id="toasts" popover="manual" role="status" aria-live="polite"></div>

    <!-- sql.js: SQLite compiled to WebAssembly. Defines the initSqlJs global that
         js/data/Database.js uses. Keep the version in step with Database.SQL_JS_VERSION. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <!-- bcrypt.js: bcrypt password hashing in plain JavaScript. Defines the
         dcodeIO.bcrypt global that js/services/Credentials.js uses. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>

    <!-- ES modules only load over http, not file://. Run a local server, e.g. python -m http.server -->
    <script type="module" src="js/Main.js"></script>
</body>

</html>
